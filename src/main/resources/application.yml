server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

minio:
  url: http://localhost:9000
  public-url: http://localhost:9000
  access-key: sscadmin
  secret-key: sscpassword123
  buckets:
    documents: ssc-documents
    templates: ssc-templates
  presigned-url-expiry: 3600
  max-file-size-mb: 10

app:
  jwt:
    secret: dev-secret-key-change-in-production-must-be-at-least-32-characters-long
    cookie-name: ssc_auth_token
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
