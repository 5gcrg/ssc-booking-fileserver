# Project-storage integration clients are configured via the PROJECT_CLIENT_n_NAME/_KEY/_FOLDER
# env vars consumed by the base application.yml.
minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

cors:
  allowed-origins: ${FRONTEND_URL}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
