services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: ssc-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sscadmin
      MINIO_ROOT_PASSWORD: sscpassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ssc-network

  ssc-fileserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssc-fileserver
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-must-be-at-least-32-characters-long}
      MINIO_ACCESS_KEY: sscadmin
      MINIO_SECRET_KEY: sscpassword123
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081}
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ssc-network

networks:
  ssc-network:
    driver: bridge

volumes:
  minio_data:
